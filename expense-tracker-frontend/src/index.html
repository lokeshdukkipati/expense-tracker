<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Track expenses, import statements and understand your money with deep analytics.">
  <meta name="theme-color" content="#0a0b14">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Apply the saved look before first paint so there is no flash of the wrong theme or accent.
    // The account's settings arrive later (PreferencesService); this copy only makes the first paint instant.
    (function () {
      try {
        var theme = 'system', accent = 'violet', reduced = false;
        var raw = localStorage.getItem('et.prefs');
        if (raw) {
          var prefs = (JSON.parse(raw) || {}).prefs || {};
          theme = prefs.theme || theme;
          accent = prefs.accent || accent;
          reduced = prefs.reduceMotion === true;
        } else {
          theme = localStorage.getItem('et.theme') || theme;
        }
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-accent', accent);
        if (reduced) root.setAttribute('data-motion', 'reduced');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0a0b14' : '#f4f5fb');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Expense Tracker needs JavaScript to run.</noscript>
</body>
</html>
