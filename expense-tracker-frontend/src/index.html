<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Track expenses, import statements and understand your money with deep analytics.">
  <meta name="theme-color" content="#0a0b14">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Apply the saved theme before first paint so there is no flash of the wrong theme.
    (function () {
      try {
        var mode = localStorage.getItem('et.theme') || 'dark';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Expense Tracker needs JavaScript to run.</noscript>
</body>
</html>
